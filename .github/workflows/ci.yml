name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Vet and test
        working-directory: cli
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Cross-compile
        working-directory: cli
        run: |
          for target in darwin/arm64 linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/painite
          done

  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips42
      - name: Install
        working-directory: server
        run: pip install -e '.[test]'
      - name: Test (includes CLI contract tests)
        working-directory: server
        run: pytest -q
