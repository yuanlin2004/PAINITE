name: User guide

# Builds site/ (python3 site/build.py) and publishes it to GitHub Pages:
# https://yuanlin2004.github.io/PAINITE/
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/pages.yml"]
  # Publishing a release moves the guide's download links to it.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A release event runs on the tag, which the github-pages environment
  # doesn't allow to deploy, so rebuild from main instead.
  redeploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Point downloads at the latest published release; drafts don't count.
          export PAINITE_VERSION=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName || true)
          python3 site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    if: github.event_name != 'pull_request' && github.event_name != 'release'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
