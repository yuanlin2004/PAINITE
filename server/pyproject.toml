[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "painite-server"
version = "1.0.0"
description = "PAINITE inference server"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyvips>=2.2",
  "numpy>=1.26",
  "cryptography>=42",
]

[project.optional-dependencies]
# Real models. torch and torchvision come from the NGC base image (or your own CUDA build).
models = ["spandrel==0.4.2", "einops>=0.7"]
test = ["pytest>=8", "httpx>=0.27", "pillow>=10"]

[project.scripts]
painite-server = "painite_server.__main__:main"

[tool.setuptools.packages.find]
include = ["painite_server*"]

[tool.setuptools.package-data]
painite_server = ["models/catalog/*", "models/arches/LICENSE-*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
