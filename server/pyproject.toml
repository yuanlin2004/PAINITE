[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "painite-server"
version = "1.2.0"
description = "PAINITE inference server"
license = {text = "Apache-2.0"}
authors = [{name = "Yuan Lin"}]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyvips>=2.2",
  "numpy>=1.26",
  "cryptography>=42",
]

[project.optional-dependencies]
# Real models. torch and torchvision come from the NGC base image (or your own CUDA build).
models = ["spandrel==0.4.2", "einops>=0.7"]
# Native install on Apple Silicon (install-mac.sh): PyTorch with MPS from PyPI,
# libvips bundled in the pyvips wheel (no Homebrew), and coremltools, which
# converts the models to Core ML (models/coreml.py).
mac = ["torch>=2.6", "torchvision>=0.21", "pyvips[binary]>=2.2.3", "coremltools>=9.0,<10"]
test = ["pytest>=8", "httpx>=0.27", "pillow>=10"]

[project.scripts]
painite-server = "painite_server.__main__:main"

[tool.setuptools.packages.find]
include = ["painite_server*"]

[tool.setuptools.package-data]
painite_server = ["models/catalog/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
