# Classical baselines stand in for "existing tools" on Linux; see README.
[[model]]
id = "denoise/baseline-nlmeans"
op = "denoise"
baseline = "nlmeans"

[[model]]
id = "sharpen/baseline-unsharp"
op = "sharpen"
baseline = "unsharp"

[[model]]
id = "upscale2x/baseline-lanczos"
op = "upscale2x"
baseline = "lanczos"

# Sharpen via super-resolution: run a 2x model, then area-downscale to the original size.
# Real-world SR models restore lens/demosaic softness that motion deblurrers are not trained on.
[[model]]
id = "sharpen/realesrgan-x2-down"
op = "sharpen"
via = "upscale2x/realesrgan-x2plus"

[[model]]
id = "sharpen/swinir-real-x2-down"
op = "sharpen"
via = "upscale2x/swinir-m-real-gan"
# HAT-L via 2x was dropped: about 13 s per 512 px tile on the Spark (see BAKEOFF.md).

[[model]]
id = "sharpen/nomosuni-x2-down"
op = "sharpen"
via = "upscale2x/nomosuni-esrgan-multijpg"

# Same models with the low-frequency color/tone anchor (painite_bench/models.py:color_anchor).
[[model]]
id = "sharpen/nomosuni-x2-down+anchor"
op = "sharpen"
via = "upscale2x/nomosuni-esrgan-multijpg"
anchor = 4

[[model]]
