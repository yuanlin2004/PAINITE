<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="The app sends the photo to the server, which cuts it into tiles, runs the AI model on each tile, stitches them and sends the result back"><style>
.box{fill:#f6f7f5;stroke:#c9d0cc;stroke-width:1.5}.box.hl{stroke:#1f7a8c;stroke-width:2}.box.bad{stroke:#c0392b;stroke-width:2}.box.ok{stroke:#4f8a2b;stroke-width:2}
.grp{fill:none;stroke:#5d6662;stroke-dasharray:5 4;stroke-width:1.2}
text{fill:#1b1f1d;font:13px "Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif}
text.t{font:700 14px "Archivo","Helvetica Neue",Arial,sans-serif}text.s{fill:#5d6662;font-size:12px}
text.m{font:12px "JetBrains Mono",Menlo,Consolas,monospace}
.arr{stroke:#5d6662;stroke-width:1.6;fill:none}.ahp{fill:#5d6662}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0 0L10 5L0 10z"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
    
    <rect class="box" x="10" y="80" width="130" height="70" rx="6"/><text class="t" x="75" y="110" text-anchor="middle">Mac app / CLI</text><text class="s" x="75" y="130" text-anchor="middle">you pick a task</text>
    <path class="arr" marker-end="url(#ah)" d="M140 115 H200"/><text class="s" x="170" y="105" text-anchor="middle">photo</text>
    <rect class="grp" x="205" y="20" width="560" height="195" rx="10"/><text class="s" x="220" y="40">PAINITE server (Spark, PC or Mac)</text>
    <rect class="box" x="225" y="80" width="120" height="70" rx="6"/><text class="t" x="285" y="110" text-anchor="middle">Cut into tiles</text><text class="s" x="285" y="130" text-anchor="middle">640 × 640 px each</text>
    <path class="arr" marker-end="url(#ah)" d="M345 115 H385"/>
    <rect class="box hl" x="390" y="60" width="180" height="110" rx="6"/><text class="t" x="480" y="90" text-anchor="middle">AI model, per tile</text><text class="s" x="480" y="112" text-anchor="middle">runs through the fastest method:</text><text class="m" x="480" y="134" text-anchor="middle">TensorRT · torch.compile</text><text class="m" x="480" y="154" text-anchor="middle">Core ML · PyTorch</text>
    <path class="arr" marker-end="url(#ah)" d="M570 115 H610"/>
    <rect class="box" x="615" y="80" width="130" height="70" rx="6"/><text class="t" x="680" y="110" text-anchor="middle">Stitch + encode</text><text class="s" x="680" y="130" text-anchor="middle">blend seams, JPEG</text>
    <path class="arr" marker-end="url(#ah)" d="M765 115 H800"/>
    <rect class="box" x="805" y="80" width="85" height="70" rx="6"/><text class="t" x="847" y="110" text-anchor="middle">Result</text><text class="s" x="847" y="130" text-anchor="middle">back to app</text>
    <text class="s" x="480" y="200" text-anchor="middle">93–98% of the time is spent in this step, so its speed decides the ranking</text>
  </svg>
