<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Each model is converted to a faster form, checked against PyTorch on test tiles, and used only if the check passes; otherwise the next method is tried, ending with plain PyTorch"><style>
.box{fill:#f6f7f5;stroke:#c9d0cc;stroke-width:1.5}.box.hl{stroke:#1f7a8c;stroke-width:2}.box.bad{stroke:#c0392b;stroke-width:2}.box.ok{stroke:#4f8a2b;stroke-width:2}
.grp{fill:none;stroke:#5d6662;stroke-dasharray:5 4;stroke-width:1.2}
text{fill:#1b1f1d;font:13px "Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif}
text.t{font:700 14px "Archivo","Helvetica Neue",Arial,sans-serif}text.s{fill:#5d6662;font-size:12px}
text.m{font:12px "JetBrains Mono",Menlo,Consolas,monospace}
.arr{stroke:#5d6662;stroke-width:1.6;fill:none}.ahp{fill:#5d6662}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0 0L10 5L0 10z"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
    
    <rect class="box" x="10" y="85" width="140" height="70" rx="6"/><text class="t" x="80" y="115" text-anchor="middle">PyTorch model</text><text class="s" x="80" y="135" text-anchor="middle">as downloaded</text>
    <path class="arr" marker-end="url(#ah)" d="M150 120 H195"/>
    <rect class="box hl" x="200" y="70" width="190" height="100" rx="6"/><text class="t" x="295" y="100" text-anchor="middle">Convert</text><text class="m" x="295" y="122" text-anchor="middle">TensorRT engine</text><text class="m" x="295" y="140" text-anchor="middle">or torch.compile</text><text class="m" x="295" y="158" text-anchor="middle">or Core ML model</text>
    <path class="arr" marker-end="url(#ah)" d="M390 120 H435"/>
    <rect class="box" x="440" y="70" width="190" height="100" rx="6"/><text class="t" x="535" y="100" text-anchor="middle">Quality check</text><text class="s" x="535" y="122" text-anchor="middle">same test tiles through</text><text class="s" x="535" y="140" text-anchor="middle">both versions; must match</text><text class="s" x="535" y="158" text-anchor="middle">PyTorch closely</text>
    <path class="arr" marker-end="url(#ah)" d="M630 100 H700 V60 H735"/><text class="s" x="668" y="90" text-anchor="middle">pass</text>
    <rect class="box ok" x="740" y="25" width="150" height="70" rx="6"/><text class="t" x="815" y="55" text-anchor="middle">Use it, save it</text><text class="s" x="815" y="75" text-anchor="middle">restarts just load it</text>
    <path class="arr" marker-end="url(#ah)" d="M630 140 H700 V180 H735"/><text class="s" x="668" y="160" text-anchor="middle">fail</text>
    <rect class="box bad" x="740" y="145" width="150" height="70" rx="6"/><text class="t" x="815" y="175" text-anchor="middle">Try next method</text><text class="s" x="815" y="195" text-anchor="middle">last resort: PyTorch</text>
    <text class="s" x="295" y="215" text-anchor="middle">jobs keep running on PyTorch meanwhile</text>
  </svg>
